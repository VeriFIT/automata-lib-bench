# End-to-end check of building, measuring and reporting both kinds of program:
# the pinned mata against its parent (`just smoke-test`, and CI). Reads only
# benchmarks/nfa/bool_comb/cox, the one family CI checks out.

[defaults]
timeout = 10
jobs = 1
builds = ["HEAD^=smoke-parent", "HEAD=smoke-head"]

[experiment.inclusion]
program = "emp-programs/automata_inclusion.emp"
inputs = "inputs/bench-double-bool-comb-cox.input"

[experiment.trim]
program = "cc-programs/trim.cc"
# The pairs '<stem>-lhs.mata;<stem>-rhs.mata' of the family, generated.
inputs = { glob = "benchmarks/nfa-bench/benchmarks/nfa/bool_comb/cox/*-lhs.mata", columns = [
  "{stem}-lhs.mata",
  "{stem}-rhs.mata",
] }
