# automata.net using mintermized inputs
automata-min:
    cmd: ./scripts/run_automata.sh ./bin/automata ./emp-programs/bool_comb_inter_sat.emp $1 $2

# mata; our tested library, version 1.0.0
mata:
    cmd: ./bin/mata-emp-interpreter ./emp-programs/bool_comb_inter_sat.emp $1 $2

# mata; our tested library with simulation reduction, version 1.0.0
mata-sim:
    cmd: ./bin/mata-emp-interpreter ./emp-programs/bool_comb_inter_sat.emp --sim $1 $2


# vata
vata:
    cmd: ./bin/vata-emp-interpreter ./emp-programs/bool_comb_inter_sat.emp $1 $2

# awali
awali:
    cmd: ./bin/awali-emp-interpreter ./emp-programs/bool_comb_inter_sat.emp $1 $2

# libmata; python binding for libmata
pymata:
    cmd: pyinterpret MataEngine ./emp-programs/bool_comb_inter_sat.emp $1 $2

# fado
pyfado:
    cmd: pyinterpret FadoEngine ./emp-programs/bool_comb_inter_sat.emp $1 $2

# automata.py
pyautomata-lib:
    cmd: pyinterpret AutomataLibEngine ./emp-programs/bool_comb_inter_sat.emp $1 $2

# automatalib
java-automatalib:
    cmd: ./scripts/run_alib.sh ./bin/automatalib-emp-interpreter.jar ./emp-programs/bool_comb_inter_sat.emp $1 $2

# brics
java-brics:
    cmd: ./scripts/run_brics.sh ./bin/brics-emp-interpreter.jar ./emp-programs/bool_comb_inter_sat.emp $1 $2

